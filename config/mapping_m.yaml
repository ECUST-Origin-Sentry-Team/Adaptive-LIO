YAML: 1.0

preprocess:
  point_filter_num: 1
  lidar_type: 1 # 1-AVIA 2-velodyne 3-ouster  4-robosense 5-pandar
  blind: 0.1
  sweep_cut_num: 1 # 不要动
  degenerate_window_num: 10

common:
  # imu_topic: /livox/imu #/imu_raw   /gps/gtimu
  # lid_topic: /livox/lidar #/points_raw  /rslidar_points /velodyne_points
  imu_topic: /livox/imu_192_168_1_163 #/imu_raw   /gps/gtimu
  # 仅供旁路车体中心速度积分，不会送入 Adaptive-LIO 主定位。
  aux_imu_topic: /livox/imu_192_168_1_160
  lid_topic: /livox/lidar_192_168_1_163 #/points_raw  /rslidar_points /velodyne_points
  aux_lidar_topic: /livox/lidar_192_168_1_160
  # IMU 加速度单位为 g：静止时 Z≈1.0，因此乘 9.81 转换为 m/s^2。
  gnorm: 1.0
  # Fusion frame alignment
  # Assume IMU frame == aft_mapped frame.
  # Relative transform aft_mapped -> base_link: [x, y, z, roll, pitch, yaw] (m, rad)
  fusion_aft_to_base_xyzrpy: [-0.04, 0.165, -0.33, 0, 0, 0]
  fusion_base_link_frame: base_link
  # 双 IMU旁路：两路旋转到 base_link 后平均，加速度积分为中心速度。
  # 主 LIO仍只使用上面的 imu_topic。
  center_odom_enable: true
  center_odom_topic: /odom_base_link
  center_primary_imu_to_base_rpy: [0, 0, 0]
  center_secondary_imu_to_base_rpy: [0, 0, 0]
  center_secondary_imu_time_offset: -0.000465044
  center_imu_sync_tolerance: 0.003
  center_acceleration_lpf_tau: 0.06
  center_estimate_initial_bias: true
  center_gravity: 9.81
  center_max_speed: 35.0
  # 同一 LIO 帧的 /odom、TF、/livox/scan 使用同一个当前 ROS 时间戳。
  # 这样既修正雷达与主机的时钟偏移，又不会让点云和 TF 错帧。
  fusion_restamp_outputs_to_now: true
  fusion_max_path_poses: 300       # 限制 odometry_path 长度，避免路径消息无限增大拖慢发布链路

mapping:
  extrinsic_est_en: true
  extrinsic_T: [0, 0, 0]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]

map_options:
  map_type: MULTI_RESOLUTION_VOXEL_HASHMAP
  resolutions:
    - resolution: 0.2
      max_num_points: 20
      min_distance_between_points: 0.05
    - resolution: 0.5
      max_num_points: 20
      min_distance_between_points: 0.15
    - resolution: 1.2
      max_num_points: 40
      min_distance_between_points: 0.2
  neig_options:
    distance_max: 80
    radius_min: 0.2
    radius_max: 1.2
    exponent: 1.0

delay_time: 0.05

aux_lidar:
  # Bundle fusion: crop aux points by main-LiDAR frame time, transform to
  # main-LiDAR output frame, then merge before buildFrame()/addSurfCostFactor().
  # Your current Livox driver already applies IMU/extrinsic compensation to both
  # topics, so identity is the correct default. Put calibration residuals here.
  enable_bundle_fusion: true
  min_points_per_measurement: 1000
  time_offset: -0.000465044       # corrected_aux_time = raw_aux_time + time_offset, seconds
  sync_margin: 0.01      # only for finding overlapping aux packets; residual points use true main window
  extrinsic_xyz: [0.001725097, 0.015043699, 0.005305687]       # p_main = R_main_aux * p_aux + t_main_aux
  extrinsic_rpy_deg: [-0.628830, 1.0566123, 0.248179]   # residual correction between current published topics

odometry:
  surf_res: 0.5
  log_print: false
  max_num_iteration: 4
  # ct_icp
  icpmodel: CT_POINT_TO_PLANE # Options: [CT_POINT_TO_PLANE, POINT_TO_PLANE]
  size_voxel_map: 0.5 # The voxel size of in the voxel map
  min_distance_points: 0.15
  max_num_points_in_voxel: 20 # The maximum number of points per voxel of the map
  max_distance: 40.0 # The threshold of the distance to suppress voxels from the map
  weight_alpha: 0.9
  weight_neighborhood: 0.1
  max_dist_to_plane_icp: 0.3 # This is important
  init_num_frames: 20
  voxel_neighborhood: 1
  max_number_neighbors: 20
  threshold_voxel_occupancy: 1
  estimate_normal_from_neighborhood: true
  min_number_neighbors: 20 # The minimum number of neighbor points to define a valid neighborhood
  power_planarity: 2.0
  num_closest_neighbors: 1

  sampling_rate: 0.8
  max_num_residuals: 500
  min_num_residuals: 50
  motion_compensation: CONSTANT_VELOCITY #NONE, CONSTANT_VELOCITY, ITERATIVE, CONTINUOUS
  beta_location_consistency: 0.001
  beta_orientation_consistency: 0.1
  beta_constant_velocity: 0.001
  beta_small_velocity: 0.01

  thres_translation_norm: 0.01 # m
  thres_orientation_norm: 0.1 # deg
  fov_segment_stride: 2 # 降低地图裁剪频率，减轻后台维护开销
  sparse_scene_distance_thresh: 20.0 # 超过该距离按稀疏远场点处理，减少邻域搜索成本
  sparse_nearest_neighbor_ratio: 3.0 # 最近邻距离上限 = max_dist_to_plane_icp * ratio
  sparse_min_planarity: 0.15 # 几何结构太弱则不进入残差构造
  map_update_translation_trigger: 0.15 # m，位移不足时跳过部分地图维护
  map_update_rotation_trigger: 0.03 # rad，转动不足时跳过部分地图维护
  map_update_max_skip_frames: 3 # 最多连续跳过多少帧地图维护

  satu_acc: 19.5 # the saturation value of IMU's acceleration. not related to the units
  satu_gyro: 16 # the saturation value of IMU's angular velocity. not related to the units

cloud_pub:
  max_z_filter: 1.5 # the roof must be filtered
  min_z_filter: -1.0 
  space_down_sample: 0.05 # should not larger than 0.05
  enable_body_filter: true
  body_filter_x_min: -0.6 # 车体系盒滤波范围，可按车体前后尺寸调整
  body_filter_x_max: 0.6
  body_filter_y_min: -0.6
  body_filter_y_max: 0.6
  body_filter_z_min: -0.3
  body_filter_z_max: 0.3

mapping_module:
  enable_mapping: false # false 时直接关闭 Scan Context 回调与后台 worker
  keyframe_dist_thresh: 1.0
  keyframe_angle_thresh: 0.8
  map_save_path: "./map_scantext.pcd"
  auto_save_interval: 20.0 # meters
  
  scantext:
    num_ring: 20
    num_sector: 60
    max_radius: 80.0
    use_scpp: true
    scpp_search_ratio: 0.1
    cart_x_unit: 5.0
    cart_y_unit: 2.0
    cart_x_max: 100.0
    cart_y_max: 40.0
